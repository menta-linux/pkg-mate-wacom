name: Build Debian channel packages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Optional testing tag (defaults to newest version tag)'
        required: false

permissions:
  contents: write

concurrency:
  group: mate-wacom-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: nightly
            suite: unstable
            image: sid
          - channel: testing
            suite: forky
            image: forky
          - channel: stable
            suite: trixie
            image: trixie
    container: debian:${{ matrix.image }}
    steps:
      - name: Install tools and build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 xz-utils devscripts dpkg-dev \
            debhelper meson ninja-build pkgconf valac libglib2.0-dev libgtk-3-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out repository in the Debian container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch tagged source
        run: git clone --tags https://github.com/KeremSoke/mate-wacom.git /tmp/mate-wacom-source
      - name: Plan package and generate changelog
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          CHANNEL: ${{ matrix.channel }}
          SUITE: ${{ matrix.suite }}
        run: |
          python3 scripts/build.py \
            --source-dir /tmp/mate-wacom-source \
            --packaging-dir "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --channel "$CHANNEL" \
            --suite "$SUITE" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            ${SOURCE_TAG:+--source-tag "$SOURCE_TAG"}
      - name: Build binary and source packages
        if: steps.plan.outputs.build == 'true'
        working-directory: dist
        run: |
          tree=$(python3 -c 'import json; print(json.load(open("build.json"))["tree"])')
          cd "$tree"
          dpkg-buildpackage -us -uc -sa
      - name: Publish release artifacts
        if: steps.plan.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.plan.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: mate-wacom ${{ steps.plan.outputs.version }} (${{ matrix.channel }} / Debian ${{ matrix.suite }})
          body_path: dist/release-body.md
          prerelease: ${{ matrix.channel != 'stable' }}
          files: |
            dist/*.deb
            dist/*.dsc
            dist/*.changes
            dist/*.buildinfo
            dist/*.tar.xz
          fail_on_unmatched_files: true
